<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quero Adotar | MundoPet</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        :root {
            --azul-gelo: #eaf8fc;
            --laranja: #e97855;
            --preto: #171717;
            --branco: #ffffff;
        }

        body {
            margin: 0;
            background: var(--azul-gelo);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--preto);
        }

        .pagina-adocao {
            min-height: 75vh;
            padding: 50px 20px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 35px;
        }

        .titulo h1 {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #555;
            margin: 0;
        }

        .formulario-adocao {
            max-width: 700px;
            margin: auto;
            background: var(--branco);
            padding: 30px;
            border-radius: 18px;
            border: 2px solid #d9edf2;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid #cfdfe3;
            border-radius: 10px;
            outline: none;
            transition: 0.2s;
        }

        .campo input:focus,
        .campo select:focus,
        .campo textarea:focus {
            border-color: var(--laranja);
            box-shadow: 0 0 0 3px rgba(233, 120, 85, 0.12);
        }

        .campo textarea {
            min-height: 100px;
            resize: vertical;
        }

        .botao-enviar {
            width: 100%;
            border: none;
            padding: 12px 20px;
            background: var(--laranja);
            color: white;
            font-size: 16px;
            font-weight: 800;
            border-radius: 11px;
            transition: 0.2s;
        }

        .botao-enviar:hover {
            background: #d96442;
            transform: translateY(-1px);
        }

        .botao-voltar {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: var(--preto);
            text-decoration: none;
            font-weight: 700;
        }

        .botao-voltar:hover {
            color: var(--laranja);
        }

        .sucesso {
            max-width: 700px;
            margin: 0 auto 25px;
            padding: 18px 20px;
            background: #ffffff;
            border: 2px solid #b9dfc4;
            border-radius: 14px;
            text-align: center;
        }

        .sucesso h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        @media (max-width: 600px) {

            .pagina-adocao {
                padding: 35px 15px;
            }

            .formulario-adocao {
                padding: 22px;
            }

            .titulo h1 {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>

    <section class="pagina-adocao">

        <div class="titulo">

            <h1>🐾 Quero Adotar!</h1>

            <p>
                Preencha seus dados e escolha o amiguinho
                que deseja conhecer.
            </p>

        </div>


        {% if enviado %}

        <div class="sucesso">

            <h2>🧡 Solicitação enviada!</h2>

            <p class="mb-0">
                Recebemos seu interesse em adotar.
                Em breve, entraremos em contato.
            </p>

        </div>

        {% endif %}


        <div class="formulario-adocao">

            <form
                action="{{ url_for('adotar') }}"
                method="POST"
            >

                <div class="campo">

                    <label for="pet_id">
                        🐾 Qual pet você deseja adotar?
                    </label>

                    <select
                        name="pet_id"
                        id="pet_id"
                        required
                    >

                        <option value="">
                            Selecione um pet
                        </option>

                        {% for pet in pets %}

                        <option value="{{ pet.id }}">

                            {{ pet.nome }}

                            —

                            {{ pet.especie }}

                            {% if pet.raca %}
                                ({{ pet.raca }})
                            {% endif %}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="campo">

                    <label for="nome">
                        👤 Seu nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        📧 Seu e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefone">
                        📱 Seu telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="mensagem">
                        💬 Por que você deseja adotar?
                    </label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        placeholder="Conte um pouco sobre seu interesse em adotar..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="botao-enviar"
                >
                    🧡 Enviar Solicitação de Adoção
                </button>


                <a
                    href="{{ url_for('galeria') }}"
                    class="botao-voltar"
                >
                    ← Voltar para os pets
                </a>

            </form>

        </div>

    </section>

</body>

</html>
