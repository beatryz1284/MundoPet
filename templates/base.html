<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MundoPet{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🐾 MundoPet
        </a>

        <div>
            <a href="/" class="btn btn-light btn-sm">🏠 Início</a>
            <a href="/cadastro" class="btn btn-light btn-sm">🐶 Cadastrar</a>
            <a href="/pets" class="btn btn-light btn-sm">🐾 Pets</a>
        </div>

    </div>
</nav>


    <main class="container py-4">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="text-center mt-5 py-4">

        <p>
            🐾 MundoPet — Cuidando de quem faz parte da família.
        </p>

    </footer>

</body>

</html>
